[project]
name = "cos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iain Livingstone", email = "iain.livingstone@ba.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.9.0",
    "tika-client>=0.11.0",
    "typer>=0.24.1",
    "voyageai>=0.3.7",
]

[project.scripts]
cos = "cos.cli:app"
cos-mcp = "cos.mcp_server.server:run"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require external services (Tika, Postgres)"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]
